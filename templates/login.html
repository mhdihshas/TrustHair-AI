<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access | TrustHire AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(59, 130, 246, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --primary-hover: #60a5fa;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --danger-border: rgba(239, 68, 68, 0.4);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --input-bg: rgba(31, 41, 55, 0.5);
            --input-border: rgba(75, 85, 99, 0.4);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        #cyberBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.1);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% auto;
            border-radius: 24px 24px 0 0;
            animation: gradientMove 4s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes cardEntrance {
            0% {
                transform: translateY(40px) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .logo-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            animation: spinClockwise 15s linear infinite;
            opacity: 0.5;
        }

        @keyframes spinClockwise {
            100% { transform: rotate(360deg); }
        }

        .login-card i.fa-shield-halved {
            font-size: 3rem;
            color: var(--primary);
            filter: drop-shadow(0 0 15px var(--primary-glow));
            position: relative;
            z-index: 2;
            transition: transform 0.5s ease;
        }

        .login-card:hover i.fa-shield-halved {
            transform: scale(1.1) rotate(5deg);
        }

        .login-card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, #a5f3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        /* Interactive Floating Input Group */
        .input-group {
            margin-bottom: 1.8rem;
            position: relative;
            text-align: left;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i.input-icon {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 1.1rem 1.1rem 1.1rem 2.8rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.2);
            background: rgba(17, 24, 39, 0.9);
        }

        .input-group label {
            position: absolute;
            left: 2.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none;
        }

        /* Floating effect when focused or has content */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -0.65rem;
            left: 0.8rem;
            font-size: 0.8rem;
            padding: 0 0.5rem;
            background: #0d1527;
            color: var(--primary);
            font-weight: 600;
            border-radius: 4px;
        }

        .input-group input:focus ~ i.input-icon {
            color: var(--primary);
            filter: drop-shadow(0 0 4px var(--primary-glow));
        }

        .toggle-password {
            position: absolute;
            right: 1.1rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        /* Buttons and Links */
        button.login-btn {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        button.login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s;
        }

        button.login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
        }

        button.login-btn:hover::after {
            left: 100%;
        }

        button.login-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        button.login-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            color: #fca5a5;
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            padding: 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 1.2rem;
            display: none;
            animation: slideIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: left;
        }

        @keyframes slideIn {
            0% { transform: translateY(-10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .shake {
            animation: cardShake 0.4s ease-in-out;
        }

        @keyframes cardShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--primary);
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .back-link i {
            margin-left: 4px;
            transition: transform 0.2s;
        }

        .back-link:hover i {
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <canvas id="cyberBg"></canvas>

    <div class="login-card" id="loginCard">
        <div class="logo-container">
            <div class="logo-ring"></div>
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>SYSTEM LOGIN</h2>
        <p>Enter credentials to access TrustHire AI</p>

        <form id="loginForm" onsubmit="attemptLogin(event)">
            <div class="input-group">
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" placeholder=" " autocomplete="off" required>
                    <label>Administrator ID</label>
                </div>
            </div>
            <div class="input-group">
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder=" " required>
                    <label>Passcode</label>
                    <i class="fa-solid fa-eye toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>
            <button type="submit" class="login-btn" id="submitBtn">AUTHENTICATE</button>
            <div id="errorText" class="error-msg"></div>
        </form>

        <a href="/signup" class="back-link">New operator? Request account <i class="fa-solid fa-arrow-right"></i></a>
    </div>

    <script>
        // Connected Nodes/Neural Network Background
        const canvas = document.getElementById('cyberBg');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        const maxDist = 120;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.7;
                this.vy = (Math.random() - 0.5) * 0.7;
                this.radius = Math.random() * 2 + 1.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(59, 130, 246, 0.4)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 75; i++) {
            particles.push(new Particle());
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(59, 130, 246, ${0.18 * (1 - dist / maxDist)})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        function animateBg() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            drawConnections();
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // Password Visibility Toggle
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePasswordBtn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.classList.remove('fa-eye');
                toggleBtn.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                toggleBtn.classList.remove('fa-eye-slash');
                toggleBtn.classList.add('fa-eye');
            }
        }

        // Login Logic
        async function attemptLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorText');
            const card = document.getElementById('loginCard');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> SECURING GATEWAY...';
            err.style.display = 'none';
            card.classList.remove('shake');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> ACCESS GRANTED';
                    setTimeout(() => window.location.href = '/', 800);
                } else {
                    throw new Error(data.error || 'Authentication rejected');
                }
            } catch (error) {
                btn.disabled = false;
                btn.innerText = "AUTHENTICATE";
                err.style.display = 'block';
                err.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${error.message}`;
                card.classList.add('shake');
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
